{% extends "base.html" %}

{% block tytul %}Logowanie — Warsztat{% endblock %}

{% block tresc %}
{# ETAP 251: tryb serwerowy — jedno hasło, jeden użytkownik (logowanie.py) #}
<section class="karta stos logowanie" aria-labelledby="naglowek-logowania">
    <h1 id="naglowek-logowania" class="tytul-raportu">Warsztat</h1>
    <p class="wyciszony">Zaloguj się hasłem ustawionym na serwerze.</p>
    {% if blad %}<p class="komunikat komunikat--blad" role="alert">{{ blad }}</p>{% endif %}
    <form method="post" class="stos">
        <label>Hasło <input type="password" name="haslo" autocomplete="current-password" required autofocus></label>
        <button type="submit">Zaloguj</button>
    </form>
</section>
{% endblock %}
